variables:
  REGISTRY: "$CI_REGISTRY"
  REGISTRY_USER: "$CI_REGISTRY_USER"
  REGISTRY_PASS: "$CI_REGISTRY_PASSWORD"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  KUBECONFIG: "/tmp/kubeconfig"        # helm too

stages:
  - build
  - package
  - deploy
  - smoke

# ---------- Build JAR ----------
build-backend:
  stage: build
  image: gradle:8.5-jdk21
  script:
    - cd backend
    - chmod +x ./gradlew
    - ./gradlew bootJar --no-daemon --build-cache
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 hour

# ---------- Test new SvelteKit frontend ----------
# Real gate, not just "tests exist" — LR-ADR-020 explicitly called out not
# repeating the backend's mistake (LR-002 pt.1: tests existed in src/test/
# but the pipeline never ran them). docker-frontend below depends on this
# job, so a red check/test run blocks the image build.
test-frontend:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend-svelte
    - npm ci
    - npm run check
    - npm run test

# ---------- Make Docker-image ----------
docker-backend:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  needs: [ build-backend ]
  script:
    - cd backend
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS $REGISTRY
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push  $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:latest

# Builds frontend-svelte (the SvelteKit rebuild, LR-ADR-001/014/015) — the
# old static frontend/ this job used to build was fully replaced this
# session (17 pages, admin/teacher panels) and is no longer deployed.
docker-frontend:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  needs: [ test-frontend ]
  script:
    - cd frontend-svelte
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS $REGISTRY
    - docker build -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push  $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA $FRONTEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:latest

deploy-dev:
  stage: deploy
  image:
    name: alpine/helm:3.19.0
    entrypoint: [ "/bin/sh", "-c" ]
  needs: [ docker-backend, docker-frontend ]
  before_script:
    # copy kubeconfig from VM200
    - echo "$KUBECONFIG_FILE" | base64 -d > $KUBECONFIG
  script:
    - |
      helm upgrade --install lr-dev ./devops/helm/lr-app \
        --namespace lr-dev --create-namespace \
        --set global.imageRegistry=registry.gitlab.com \
        --set backend.image.repository=okh3/lebens_rhythmus/backend \
        --set frontend.image.repository=okh3/lebens_rhythmus/frontend \
        --set global.imageTag=$CI_COMMIT_SHORT_SHA \
        --set postgres.db=lebens_rhythmus \
        --set backend.env.JWT_EXPIRATION="86400000"

  tags:
    - lr-runner
