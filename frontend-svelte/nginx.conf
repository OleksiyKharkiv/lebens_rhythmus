server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # LR-100: HTTP Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # LR-100: Content Security Policy
    # Note: 'sha256-tdFIEi7iPU0arXC0zgYmYREB1FHZommdAI8zFgGml/o=' is the sha256 hash of LR-019's anti-FOUC theme script in app.html (LF)
    # Note: 'sha256-4Rslfbm00h3mdq02qlFuA7KshCP4d7tDslg569mzU58=' is the CRLF variant of the same script
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-tdFIEi7iPU0arXC0zgYmYREB1FHZommdAI8zFgGml/o=' 'sha256-4Rslfbm00h3mdq02qlFuA7KshCP4d7tDslg569mzU58='; connect-src 'self' https://api.tlab29.com https://api.stripe.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none';" always;

    # adapter-static builds this as an SPA (fallback: 'index.html', see
    # vite.config.ts) — every page fetches its data client-side via $effect,
    # never SvelteKit load(), and several routes are inherently
    # dynamic/auth-gated (dashboard, admin/*, teacher). Without this
    # try_files fallback, a direct/deep link to any route other than "/"
    # 404s here even though the same URL works fine when reached via
    # client-side navigation (documented gap, LR-002 pt.4b).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Only the content-hashed subfolder is safe to cache forever — build/
    # also has _app/version.json directly (no hash in the name, changes
    # every deploy, polled by SvelteKit's client runtime to detect a new
    # version) which must NOT get the same immutable treatment.
    location ^~ /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Without this, a browser's heuristic caching can keep serving a stale
    # shell after a deploy even though the hashed assets it points at are
    # gone/replaced.
    # Note: Nginx's add_header in a child block overrides all parent add_header directives,
    # so security headers must be re-applied here to ensure index.html gets them.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-tdFIEi7iPU0arXC0zgYmYREB1FHZommdAI8zFgGml/o=' 'sha256-4Rslfbm00h3mdq02qlFuA7KshCP4d7tDslg569mzU58='; connect-src 'self' https://api.tlab29.com https://api.stripe.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none';" always;
    }
}
