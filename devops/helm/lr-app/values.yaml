global:
  imageRegistry: ""   # Set from CI pipeline - registry URL
  imageTag: ""        # Set from CI pipeline - commit SHA or tag

backend:
  replicaCount: 1
  image:
    repository: ""    # Set from CI pipeline - backend image repository
    tag: ""           # Set from CI pipeline - backend image tag
  service:
    port: 8080
    # LR-031 Phase 1 — actuator's port, deliberately not exposed in
    # backend-service.yaml (see that file + backend-deployment.yaml's
    # probes) — closes audit finding M7, matches numi's dedicated
    # metrics-port pattern.
    managementPort: 9090
  imagePullSecrets:
    - name: gitlab-registry
  # Environment variables for backend application
  env:
    SPRING_DATASOURCE_URL: jdbc:postgresql://lr-postgres:5432/lebens_rhythmus
    JWT_EXPIRATION: "86400000"
  # JWT_SECRET / FIELD_ENCRYPTION_KEY / SMTP_USERNAME / SMTP_PASSWORD: NOT set
  # via values/--set — read from Secret `lr-backend-secrets`, created
  # out-of-band, same convention as `lr-db-credentials`. jwt-secret/
  # field-encryption-key must exist BEFORE `helm upgrade --install` (pod
  # won't start without them). smtp-username/smtp-password are `optional:
  # true` in backend-deployment.yaml (LR-013) — safe to add later without
  # touching this file again, just patch the existing secret:
  #   kubectl -n lr-dev create secret generic lr-backend-secrets \
  #     --from-literal=jwt-secret=<32+ byte random string> \
  #     --from-literal=field-encryption-key=<base64, 32 raw bytes>
  #   openssl rand -base64 32   # generates a valid field-encryption-key
  #
  #   # Adding SMTP creds later, without touching the two keys above:
  #   kubectl -n lr-dev patch secret lr-backend-secrets -p \
  #     '{"stringData":{"smtp-username":"<brevo smtp login>","smtp-password":"<brevo smtp key>"}}'

postgres:
  db: lebens_rhythmus  # PostgreSQL database name
  storage: 10Gi        # Storage size for PostgreSQL persistence

# LR-031 Phase 2 — default-deny NetworkPolicy for lr-dev (closes audit
# finding M4: Postgres reachable from any pod). See templates/
# networkpolicy-*.yaml for the actual rules.
networkPolicy:
  # Same reasoning as postgresBackup.enabled below, and it's the same
  # unconditional-CI-push risk: defaults false so an ordinary push for an
  # unrelated ticket can't be the first time this is ever live. Flip to
  # true ONLY after a manual, verified `helm upgrade` run from mgmt-core
  # confirms (a) the DNS/Traefik-namespace selectors in the templates
  # actually match this cluster's real labels, and (b) flannel actually
  # enforces NetworkPolicy at all — docs/security/roadmap.md Фаза 2 item 6
  # explicitly warns not to assume this from the manifest existing, same
  # lesson as the numi-nat.service/Litestream "active ≠ working" incidents
  # in KNOWN_ISSUES.md. Step-by-step verification procedure:
  # docs/runbooks/infra-fix-shutdown.md "LR-031 Phase 2".
  enabled: false

# Interim minimum backup solution (LR-003) — lr-postgres had NO backup at
# all before this. Temporary until the autumn hardware upgrade brings a
# dedicated backup controller; not the final answer, see tickets.md LR-003.
postgresBackup:
  # Defaults to false on purpose (architect-reviewer finding, 2026-07-24):
  # .gitlab-ci.yml's deploy-dev runs `helm upgrade --install` unconditionally
  # on every push with no postgresBackup.* overrides — if this defaulted to
  # true, the very next ordinary push (for any unrelated ticket) would
  # silently create a CronJob referencing a Secret that doesn't exist yet
  # and an empty repository, failing nightly with nobody noticing. Flip to
  # true (via --set, or here once real) only after lr-backup-secrets exists
  # and repository below is set to the real bucket URL — see tickets.md LR-003
  # "Осталось сделать".
  enabled: false
  schedule: "0 3 * * *"       # 03:00 UTC daily — off-peak for a single-timezone EU user base
  image: postgres:16-alpine   # has pg_dump; restic installed on the fly via apk (see ConfigMap)
  # S3-compatible repository URL (IDrive e2, same provider as numi's
  # Litestream — separate bucket/credentials, not shared with numi).
  # Format: s3:https://<endpoint>/<bucket-name>
  repository: ""              # e.g. s3:https://s3.eu-central-1.idrivee2.com/lr-backup
  retention:
    daily: 14
    weekly: 8
  # restic-password / access-key-id / secret-access-key: read from Secret
  # `lr-backup-secrets`, created out-of-band, same convention as
  # `lr-backend-secrets`. Must exist in namespace `lr-dev` BEFORE
  # `helm upgrade --install`, e.g.:
  #   kubectl -n lr-dev create secret generic lr-backup-secrets \
  #     --from-literal=restic-password=<new random string, NOT reused from anywhere else> \
  #     --from-literal=access-key-id=<IDrive e2 access key, this project's own bucket> \
  #     --from-literal=secret-access-key=<IDrive e2 secret key>
  #   openssl rand -base64 32   # generates a valid restic-password

frontend:
  replicaCount: 1
  image:
    repository: ""    # Set from CI pipeline - frontend image repository
    tag: ""           # Set from CI pipeline - frontend image tag
  service:
    port: 80
  imagePullSecrets:
    - name: gitlab-registry