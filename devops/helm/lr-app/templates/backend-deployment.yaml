apiVersion: apps/v1
kind: Deployment
metadata:
  name: lr-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  # Default RollingUpdate rounds maxSurge up to 1 pod even at replicas: 1,
  # meaning a new pod can start (and serve traffic) before the old one
  # terminates — a real overlap window for any change that pairs a schema
  # migration with new application behavior (found reviewing the
  # email-verification backfill migration, 2026-08-04: a registration
  # landing on the outgoing old-code pod during that overlap could get
  # swept into the new pod's "grandfather existing users" backfill and end
  # up verified without ever verifying). Recreate costs nothing extra —
  # already single-replica, so there's no availability benefit from the
  # rolling surge to give up.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lr-backend
  template:
    metadata:
      labels:
        app: lr-backend
    spec:
      nodeSelector:
        project: lr
      imagePullSecrets:
        {{- toYaml .Values.backend.imagePullSecrets | nindent 8 }}
      initContainers:
        - name: wait-for-db
          image: postgres:16-bullseye
          command:
            - sh
            - -c
            - |
              # Wait for PostgreSQL server to be ready
              echo "Waiting for Postgres to be ready..."
              until pg_isready -h lr-postgres.lr-dev.svc.cluster.local -p 5432 -U "$POSTGRES_USER"; do
                echo "Postgres server not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Postgres server is ready!"

              # Wait for specific database to be created
              echo "Checking if database $POSTGRES_DB exists..."
              until psql -h lr-postgres.lr-dev.svc.cluster.local -U "$POSTGRES_USER" -lqt | cut -d \| -f 1 | grep -qw "$POSTGRES_DB"; do
                echo "Database $POSTGRES_DB not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Database $POSTGRES_DB is ready!"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lr-db-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lr-db-credentials
                  key: password
            - name: POSTGRES_DB
              value: "lebens_rhythmus"
      containers:
        - name: lr-backend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.backend.service.port }}
            # LR-031 Phase 1 — actuator's own port, deliberately NOT listed
            # in backend-service.yaml's exposed ports (closes audit finding
            # M7 — actuator no longer reachable through the k8s Service/
            # Ingress/public domain at all). Only reachable via direct pod
            # IP — which is exactly how the liveness/readinessProbe below
            # already talk to it (kubelet probes bypass the Service).
            - containerPort: {{ .Values.backend.service.managementPort }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://lr-postgres:5432/lebens_rhythmus"
            - name: JWT_EXPIRATION
              value: "{{ .Values.backend.env.JWT_EXPIRATION }}"
            - name: MANAGEMENT_SERVER_PORT
              value: "{{ .Values.backend.service.managementPort }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lr-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lr-db-credentials
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lr-backend-secrets
                  key: jwt-secret
            - name: FIELD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lr-backend-secrets
                  key: field-encryption-key
            # Brevo SMTP relay (email verification, LR-013) — until these
            # keys actually exist on lr-backend-secrets, application.
            # properties' ${SMTP_USERNAME:}/${SMTP_PASSWORD:} defaults keep
            # them empty and registration emails silently fail to send
            # (caught, logged, doesn't 500 — see EmailVerificationService).
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lr-backend-secrets
                  key: smtp-username
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lr-backend-secrets
                  key: smtp-password
                  optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.backend.service.managementPort }}
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.backend.service.managementPort }}
            initialDelaySeconds: 30
            periodSeconds: 5