spring.application.name=backend
spring.datasource.url=jdbc:postgresql://lr-postgres:5432/lebens_rhythmus
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.docker.compose.file=backend/compose.yaml
spring.docker.compose.lifecycle-management=start-only
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# spring-boot-starter-mail auto-registers MailHealthIndicator (Spring Boot
# actuator, mail/MailHealthContributorAutoConfiguration — fires whenever a
# MailSender bean exists) — it probes real SMTP connectivity as part of
# /actuator/health. With no real Brevo creds yet (SMTP_USERNAME/PASSWORD
# empty), that probe fails, drags the WHOLE health endpoint's aggregate
# status to DOWN -> Spring Boot maps DOWN to HTTP 503 by default -> both the
# GitLab CI smoke-test AND this pod's own readiness/liveness probes (which
# also point at /actuator/health) start failing, even though the actual app
# (login, registration, etc.) works fine. Found live in prod 2026-08-04
# right after the email-verification deploy. Mail delivery health isn't
# core app health here — disabling this specific indicator, not the whole
# health endpoint.
management.health.mail.enabled=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.field-encryption.key=${FIELD_ENCRYPTION_KEY}
# Brevo SMTP relay (same provider as numi, separate LR sender domain/account)
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM_ADDRESS:noreply@tlab29.com}
app.frontend-url=${FRONTEND_URL:https://tlab29.com}
app.email-verification.token-ttl-hours=${EMAIL_VERIFICATION_TTL_HOURS:24}
# LR-014 — floor for POST /auth/resend-verification's response time, so the
# branch that skips (unknown/already-verified email) can't be told apart
# from the branch that sends (token + DB write + synchronous SMTP) by
# response speed alone. Tune upward if real SMTP round-trips regularly
# exceed this on the actual Brevo relay.
app.email-verification.resend-min-response-ms=${EMAIL_VERIFICATION_RESEND_MIN_MS:400}
cors.allowed-origins[0]=https://tlab29.com
cors.allowed-origins[1]=http://tlab29.com
cors.allowed-origins[2]=https://www.tlab29.com
cors.allowed-origins[3]=http://localhost:3000
cors.allowed-origins[4]=http://localhost:8080
cors.allowed-origins[5]=https://api.tlab29.com
cors.allowed-origins[6]=http://localhost:63342
cors.allow-credentials=true
cors.max-age=3600
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.be=DEBUG