spring.application.name=backend
spring.datasource.url=jdbc:postgresql://lr-postgres:5432/lebens_rhythmus
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.docker.compose.file=backend/compose.yaml
spring.docker.compose.lifecycle-management=start-only
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.field-encryption.key=${FIELD_ENCRYPTION_KEY}
# Brevo SMTP relay (same provider as numi, separate LR sender domain/account)
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM_ADDRESS:noreply@tlab29.com}
app.frontend-url=${FRONTEND_URL:https://tlab29.com}
app.email-verification.token-ttl-hours=${EMAIL_VERIFICATION_TTL_HOURS:24}
cors.allowed-origins[0]=https://tlab29.com
cors.allowed-origins[1]=http://tlab29.com
cors.allowed-origins[2]=https://www.tlab29.com
cors.allowed-origins[3]=http://localhost:3000
cors.allowed-origins[4]=http://localhost:8080
cors.allowed-origins[5]=https://api.tlab29.com
cors.allowed-origins[6]=http://localhost:63342
cors.allow-credentials=true
cors.max-age=3600
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.be=DEBUG