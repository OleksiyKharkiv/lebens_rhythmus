# Workaround for Docker Desktop 4.52+ (Docker Engine v29): the docker-java
# client bundled with Testcontainers 1.x (pulled in via Spring Boot 3.5.7's
# dependency management) hardcodes a fallback to API version 1.32 instead of
# negotiating with the daemon — Engine v29 requires >= 1.40 and rejects it
# outright ("client version 1.32 is too old"). Pinning a modern version here
# skips the broken negotiation. See KNOWN_ISSUES.md.
#
# Real fix (not applied here — bigger, riskier change): upgrade Testcontainers
# to 2.0.2+, which negotiates correctly on its own.
api.version=1.44
